name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # The design-system gallery is no longer in this repo. `npm run
      # build` renders it with the rastrillo framework's dsgen command,
      # at the sha in src/_data/docsversion.json, so the site needs Go as
      # well as Node. Without it hack/gen-design-system.mjs stops the
      # build rather than let a site publish with no design system.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # There is no go.mod here for the built-in cache to key on.
          cache: false

      - id: pin
        run: echo "sha=$(jq -r .sha src/_data/docsversion.json)" >> "$GITHUB_OUTPUT"
      # Keyed on the framework sha, which is exactly what decides what
      # gets downloaded and compiled: same pin, same cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: dsgen-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      - run: npm ci
      - run: npm run check
